<div class="auth-container">
  <div class="auth-box">
    <div class="brand">
      <div class="logo">M</div>
      <h2>Mediolike</h2>
    </div>

    <div class="form-container">
      <h3>{{ token ? 'Crear Nueva Contraseña' : 'Recuperar Contraseña' }}</h3>
      <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">
        {{ token ? 'Ingresa tu nueva contraseña a continuación.' : 'Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.' }}
      </p>

      <div *ngIf="successMessage" style="background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid rgba(16, 185, 129, 0.2);">
        <i class="pi pi-check-circle"></i> {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid rgba(239, 68, 68, 0.2);">
        <i class="pi pi-exclamation-triangle"></i> {{ errorMessage }}
      </div>

      <form (submit)="onSubmit($event)">
        
        <div class="input-group" *ngIf="!token">
          <label>Correo Electrónico</label>
          <input type="email" placeholder="tu@correo.com" [(ngModel)]="email" name="email" required />
        </div>

        <div class="input-group" *ngIf="token">
          <label>Nueva Contraseña</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input [type]="showPassword ? 'text' : 'password'" placeholder="********" [(ngModel)]="newPassword" name="newPassword" required minlength="6" style="width: 100%;" />
            <button type="button" (click)="showPassword = !showPassword" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #a1a1aa;">
              <i class="pi" [ngClass]="showPassword ? 'pi-eye' : 'pi-eye-slash'"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="primary-btn mt-3" [disabled]="submitted">
          {{ submitted ? 'Procesando...' : (token ? 'ACTUALIZAR CONTRASEÑA' : 'ENVIAR ENLACE') }}
        </button>

        <div class="form-footer mt-3" style="text-align: center;">
          <a routerLink="/login" class="ghost-btn" style="text-decoration: none; display: inline-block;">Volver al Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
