<div class="admin-container">
  
  <div class="page-header">
    <h1>Gestión de Usuarios</h1>
    <p>Administra los roles, accesos y estados de las cuentas de la plataforma.</p>
  </div>

  <div class="table-card">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="pi pi-search"></i>
        <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar por nombre o correo...">
      </div>
      <button class="btn-primary" (click)="inviteUser()"><i class="pi pi-user-plus"></i> Invitar Usuario</button>
    </div>

    <div class="data-table">
      <div class="table-header">
        <div class="col-user">Usuario</div>
        <div class="col-role">Rol</div>
        <div class="col-status">Estado</div>
        <div class="col-date">Último Acceso</div>
        <div class="col-actions">Acciones</div>
      </div>

      <div class="table-row" *ngFor="let user of filteredUsers">
        <div class="col-user">
          <div class="user-avatar">{{ user.name.charAt(0) }}</div>
          <div class="user-info">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-email">{{ user.email }}</span>
          </div>
        </div>
        
        <div class="col-role">
          <select [ngModel]="user.role" (ngModelChange)="changeRole(user, $event)" class="role-select" [ngClass]="{'role-admin': user.role === 'Admin', 'role-instructor': user.role === 'Instructor'}">
            <option value="Participant">Estudiante</option>
            <option value="Instructor">Instructor</option>
            <option value="Admin">Administrador</option>
          </select>
        </div>
        
        <div class="col-status">
          <span class="status-badge" [class.active]="user.status === 'Activo'" [class.inactive]="user.status === 'Inactivo'">
            {{ user.status }}
          </span>
        </div>
        
        <div class="col-date">{{ user.lastLogin | date }}</div>
        
        <div class="col-actions">
          <button class="btn-icon" [title]="user.status === 'Activo' ? 'Suspender' : 'Activar'" (click)="toggleStatus(user)">
            <i class="pi" [ngClass]="user.status === 'Activo' ? 'pi-ban text-danger' : 'pi-check-circle text-success'"></i>
          </button>
        </div>
      </div>
      
      <div class="empty-state" *ngIf="filteredUsers.length === 0">
        <i class="pi pi-users"></i>
        <p>No se encontraron usuarios.</p>
      </div>
    </div>
  </div>

</div>
