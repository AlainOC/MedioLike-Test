<div class="hybrid-dashboard">
  
  <!-- CATEGORY CHIPS (YouTube Style) -->
  <div class="chips-container">
    <button *ngFor="let cat of categories" 
            class="chip-btn" 
            [class.active]="cat === activeCategory"
            (click)="setCategory(cat)">
      {{ cat }}
    </button>
  </div>

  <!-- LIVE STREAMS (Twitch Style) -->
  <section class="live-section">
    <h2 class="section-title"><i class="pi pi-video"></i> En Vivo Ahora</h2>
    <div class="live-grid">
      <div class="live-card" *ngFor="let stream of liveStreams" (click)="goToCourse(1)" style="cursor: pointer;">
        <div class="live-thumb-wrapper">
          <img [src]="stream.image" [alt]="stream.title" class="live-thumb">
          <div class="live-badge">LIVE</div>
          <div class="viewers-badge"><i class="pi pi-eye"></i> {{ stream.viewers }}</div>
        </div>
        <div class="live-info">
          <div class="streamer-avatar">{{ stream.streamer.charAt(0) }}</div>
          <div class="stream-details">
            <h3>{{ stream.title }}</h3>
            <p>{{ stream.streamer }}</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- RUTA DE APRENDIZAJE (Udemy/Cisco Style) -->
  <section class="learning-path-section">
    <h2 class="section-title"><i class="pi pi-compass"></i> Tu Ruta de Aprendizaje</h2>
    <div class="path-timeline">
      <div class="path-node" *ngFor="let node of learningPath; let i = index" [class.locked]="node.locked" [class.completed]="node.isCompleted">
        
        <!-- Conector visual -->
        <div class="node-connector" *ngIf="i !== learningPath.length - 1"></div>
        
        <!-- Punto del timeline -->
        <div class="node-indicator">
          <i class="pi" [ngClass]="{'pi-check': node.isCompleted, 'pi-lock': node.locked, 'pi-play': !node.isCompleted && !node.locked}"></i>
        </div>

        <!-- Tarjeta del módulo -->
        <div class="node-card">
          <img [src]="node.image" [alt]="node.title" class="node-thumb">
          <div class="node-content">
            <h3>{{ node.title }}</h3>
            <div class="progress-container" *ngIf="!node.locked">
              <div class="progress-bar"><div class="fill" [style.width]="node.progress + '%'"></div></div>
              <span class="progress-text">{{ node.progress }}%</span>
            </div>
            <div class="locked-msg" *ngIf="node.locked">
              <i class="pi pi-info-circle"></i> Completa el módulo anterior para desbloquear.
            </div>
          </div>
          <button class="action-btn" [disabled]="node.locked" (click)="goToCourse(node.id)">
            {{ node.isCompleted ? 'Repasar' : (node.locked ? 'Bloqueado' : 'Continuar') }}
          </button>
        </div>

      </div>
    </div>
  </section>

</div>
