<div class="auth-container">
  <div class="auth-box">
    <div class="brand">
      <div class="logo">M</div>
      <h2>Mediolike</h2>
    </div>

    <div class="form-container">
      <h3>Recuperar Contraseña</h3>
      <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">
        Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.
      </p>

      <form (submit)="onSubmit($event)">
        <div class="input-group">
          <label>Correo Electrónico</label>
          <input type="email" placeholder="tu@correo.com" [(ngModel)]="email" name="email" required />
        </div>

        <button type="submit" class="primary-btn mt-3" [disabled]="submitted">
          {{ submitted ? 'Enviando...' : 'ENVIAR ENLACE' }}
        </button>

        <div class="form-footer mt-3" style="text-align: center;">
          <a routerLink="/login" class="ghost-btn" style="text-decoration: none; display: inline-block;">Volver al Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
