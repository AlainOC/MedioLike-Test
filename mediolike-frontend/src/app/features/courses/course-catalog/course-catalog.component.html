<div class="catalog-container">
  
  <div class="catalog-header">
    <h1>Explora nuestro catálogo</h1>
    <p>Aprende las habilidades del futuro con expertos de la industria.</p>
    
    <div class="search-bar">
      <i class="pi pi-search"></i>
      <input type="text" placeholder="¿Qué quieres aprender hoy?" [(ngModel)]="searchQuery">
    </div>
  </div>

  <div class="chips-container">
    <button *ngFor="let cat of categories" 
            class="chip-btn" 
            [class.active]="cat === selectedCategory"
            (click)="setCategory(cat)">
      {{ cat }}
    </button>
  </div>

  <div class="courses-grid">
    <div class="course-card" *ngFor="let course of filteredCourses" [routerLink]="['/app/courses', course.id]">
      <div class="course-thumb-wrapper">
        <img [src]="course.image" [alt]="course.title" class="course-thumb">
        <div class="category-badge">{{ course.category }}</div>
      </div>
      
      <div class="course-info">
        <h3>{{ course.title }}</h3>
        <p class="instructor">{{ course.instructor }}</p>
        
        <div class="course-meta">
          <span class="rating"><i class="pi pi-star-fill"></i> {{ course.rating }} ({{ course.students }})</span>
          <span class="price">${{ course.price }}</span>
        </div>
      </div>
    </div>
    
    <div *ngIf="filteredCourses.length === 0" class="no-results">
      <i class="pi pi-inbox"></i>
      <p>No encontramos cursos que coincidan con tu búsqueda.</p>
    </div>
  </div>

</div>
