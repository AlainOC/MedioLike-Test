services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: mediolike_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-mediolike_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
      POSTGRES_DB: ${DB_NAME:-mediolike_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mediolike_network

  # PgAdmin para administrar la BD de manera visual
  pgadmin:
    image: dpage/pgadmin4
    container_name: mediolike_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - mediolike_network

  # Backend API (Express.js) - Placeholder
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediolike_backend
    restart: always
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mediolike_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
      DB_NAME: ${DB_NAME:-mediolike_db}
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - mediolike_network

  # Frontend (Angular) - Placeholder
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediolike_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mediolike_network

volumes:
  postgres_data:

networks:
  mediolike_network:
    driver: bridge
