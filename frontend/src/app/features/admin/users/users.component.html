<div class="card p-4 mx-4 my-4 shadow-sm border-round border-1 surface-border">
    <h2>Administración de Usuarios</h2>

    <div class="mb-3 flex justify-content-end">
        <p-button label="Nuevo Usuario" icon="pi pi-plus" (onClick)="showDialog()"></p-button>
    </div>

    <p-table [value]="users" [paginator]="true" [rows]="10" responsiveLayout="scroll">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Status</th>
                <th>Rol</th>
                <th>Alta</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
            <tr>
                <td>{{user.id.substring(0,8)}}...</td>
                <td>{{user.email}}</td>
                <td>
                    <span class="p-tag"
                        [ngClass]="{'p-tag-success': user.status === 'ACTIVE', 'p-tag-danger': user.status === 'SUSPENDED'}">
                        {{user.status}}
                    </span>
                </td>
                <td>{{user.roleId}}</td>
                <td>{{user.createdAt | date}}</td>
                <td>
                    <p-button icon="pi pi-pencil" styleClass="p-button-rounded p-button-info mr-2"
                        size="small"></p-button>
                    <p-button icon="pi pi-trash" styleClass="p-button-rounded p-button-danger" size="small"
                        (onClick)="deleteUser(user.id)"></p-button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6">No se encontraron usuarios.</td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog [(visible)]="displayDialog" [style]="{width: '450px'}" header="Detalles del Usuario" [modal]="true"
        class="p-fluid">
        <form [formGroup]="userForm" (ngSubmit)="saveUser()">
            <div class="field">
                <label for="email">Correo Electrónico</label>
                <input type="email" pInputText id="email" formControlName="email" required autofocus />
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" pInputText id="password" formControlName="passwordHash" required />
            </div>
            <div class="field">
                <label for="status">Estatus</label>
                <input type="text" pInputText id="status" formControlName="status" />
            </div>
            <div class="field">
                <label for="roleId">Role ID</label>
                <input type="text" pInputText id="roleId" formControlName="roleId" required />
            </div>
            <div class="form-actions mt-3 flex justify-content-end">
                <p-button label="Cancelar" icon="pi pi-times" class="p-button-text mr-2"
                    (onClick)="hideDialog()"></p-button>
                <p-button label="Guardar" icon="pi pi-check" type="submit" [disabled]="userForm.invalid"></p-button>
            </div>
        </form>
    </p-dialog>
</div>
